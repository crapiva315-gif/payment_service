services:
  # Single-node replica set: needed for transactions (payment + outbox row) and for Debezium (change streams).
  # From the host (apps run in IntelliJ) connect with ?directConnection=true:
  #   mongodb://localhost:27017/payments_db?directConnection=true
  # The replica set member is announced as mongodb:27017, which only containers of this network can resolve.
  mongodb:
    image: 'mongo:latest'
    container_name: payment_mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - '27017:27017'
    healthcheck:
      # the first run initiates the replica set (and reports unhealthy), later runs check its status
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { quit(rs.status().ok ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}); quit(1) }\""]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  # Single-node Kafka in KRaft mode (no Zookeeper).
  #   from the host machine (apps run in IntelliJ):  localhost:9092
  #   from other containers in this compose network: kafka:19092
  kafka:
    image: 'apache/kafka:3.9.1'
    container_name: payment_kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - default
      - shared      # lets other compose projects (order_service) reach the broker as kafka:19092

  # One-shot: creates the topic Debezium publishes to (3 partitions; events of one order share a key).
  kafka-init:
    image: 'apache/kafka:3.9.1'
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic payment-events --partitions 3 --replication-factor 1"
    restart: "no"

  # Kafka Connect with the Debezium connectors.
  connect:
    image: 'quay.io/debezium/connect:3.7'
    container_name: payment_connect
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - '8083:8083'
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: payment-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

  # One-shot: registers (or updates) the outbox connector through the Connect REST API.
  connector-init:
    image: 'curlimages/curl:8.11.1'
    depends_on:
      connect:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./debezium/payment-outbox-connector.json:/connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "until curl -sf http://connect:8083/connectors > /dev/null; do echo 'waiting for Kafka Connect...'; sleep 3; done; curl -sS -f -X PUT -H 'Content-Type: application/json' --data @/connector.json http://connect:8083/connectors/payment-outbox-connector/config && echo ' - connector registered'"
    restart: "no"

# Shared network, created once with:  docker network create microservices-net
networks:
  shared:
    name: microservices-net
    external: true