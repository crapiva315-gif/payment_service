
name: payment-system

services:
  mongodb:
    image: mongo:latest
    container_name: payment_mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - payment-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().ok ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}); quit(1) }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    networks:
      - payment-network

  kafka:
    image: apache/kafka:3.9.1
    container_name: payment_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - payment-network

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create --if-not-exists
        --topic payment-events
        --partitions 3
        --replication-factor 1
    restart: "no"
    networks:
      - payment-network

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: payment-service:latest
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/payments_db?replicaSet=rs0
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    networks:
      - payment-network

  connect:
    image: quay.io/debezium/connect:3.7
    container_name: payment_connect
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: payment-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    networks:
      - payment-network

  connector-init:
    image: curlimages/curl:8.11.1
    depends_on:
      connect:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./debezium/payment-outbox-connector.json:/connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until curl -sf http://connect:8083/connectors > /dev/null;
        do echo 'waiting for Kafka Connect...'; sleep 3; done;
        curl -sS -f -X PUT
        -H 'Content-Type: application/json'
        --data @/connector.json
        http://connect:8083/connectors/payment-outbox-connector/config
    restart: "no"
    networks:
      - payment-network

volumes:
  payment-mongo-data:

networks:
  payment-network:
    driver: bridge
