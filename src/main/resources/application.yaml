spring:
  application:
    name: payment_service
  mongodb:
    uri: mongodb://localhost:27017/payments_db
  docker:
    compose:
      enabled: false

app:
  liquibase:
    mongo-url: ${spring.mongodb.uri}
  random-api:
    url: https://www.random.org/integers/?num=1&min=1&max=1000&col=1&base=10&format=plain&rnd=new
    timeout-ms: 3000